<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primesight First Responder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="site.css">
<style>
  /* Two steps: the location (building from the list, floor from the dropdown on the map), then the emergency. */
  [hidden] { display: none !important; }
  /* clip, not hidden: scrollIntoView on a row must not side-scroll the page or panel while a step is still sliding in */
  body { height: 100vh; padding-top: 64px; overflow: clip; }
  button:disabled { cursor: default; opacity: .35; }
  .nav { background: var(--ink); border-bottom: 1px solid var(--line); }

  main { display: grid; grid-template-columns: 400px 1fr; height: 100%; min-height: 0; }
  #panel { position: relative; border-right: 1px solid var(--line); overflow: clip; background: var(--ink); }
  #trail { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px; border-bottom: 1px solid var(--line); min-width: 0; }
  #trail button { background: none; padding: 4px 0; border-radius: 0; color: var(--dim); font: inherit; letter-spacing: inherit; text-transform: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #trail button:not(:disabled):hover, #trail button[aria-current] { color: var(--text); }
  #trail .sep { color: var(--line); }
  .step { position: absolute; inset: 44px 0 0; display: flex; flex-direction: column; padding: 22px 20px 18px; opacity: 0; visibility: hidden;
          transform: translateX(32px); transition: opacity .3s var(--ease), transform .3s var(--ease), visibility 0s .3s; }
  .step.past { transform: translateX(-32px); }
  .step.on { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .step h2 { font: 400 30px/1.1 var(--grot); letter-spacing: -.01em; margin: 0 0 16px; }
  .step input { margin-bottom: 12px; border-radius: 0; background: var(--ink); }
  .rows { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -20px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none;
         border-radius: 0; border-left: 2px solid transparent; padding: 11px 20px 11px 18px; color: var(--text); font: 400 17px/1.3 var(--grot); }
  /* Black and orange: orange labels on black, and the chosen row turns solid orange. */
  .rows { scrollbar-color: var(--accent) #0000; }
  .row span { color: var(--accent); font: 400 11px var(--code); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
  .row:hover { color: var(--accent); }
  .row.sel, .row.sel span { background: var(--accent); color: var(--ink); }
  .step input:focus { border-color: var(--accent); outline: none; }
  .none { padding: 11px 20px; color: var(--dim); }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .cats button { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); border-radius: 0; color: var(--text);
                 font: 400 14px var(--grot); padding: 9px 10px; text-transform: capitalize; }
  .cats button i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .cats button.sel { background: var(--panel2); border-color: var(--text); }
  #text { padding: 14px 0; min-height: 4.6em; color: var(--dim); border-top: 1px solid var(--line); }
  #text.ready { color: var(--text); }
  .foot { display: flex; gap: 10px; align-items: center; }
  .step[data-s="1"] .foot { padding-top: 16px; border-top: 1px solid var(--line); }
  .foot button { flex: 1; border-radius: 0; padding: 14px 16px; font: 400 12px var(--code); letter-spacing: .07em; text-transform: uppercase; }
  .foot .ghost { flex: 0 0 auto; }
  #sent { gap: 14px; } #sent b { flex: 1; font-weight: 400; color: var(--ok); }

  #stage { position: relative; background: #05080c; overflow: hidden; }
  .view { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .5s var(--ease), visibility 0s .5s; }
  .view.on { opacity: 1; visibility: visible; transition-delay: 0s; }
  #aimg { width: 100%; height: 100%; object-fit: contain; transition: opacity .3s; }
  #aimg.loading { opacity: .2; }
  .glass { background: #05080ccc; border: 1px solid var(--line); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #caption { position: absolute; left: 16px; bottom: 16px; padding: 7px 12px; font-size: 13px; }
  #caption:empty { display: none; }
  /* Top right of the map: the floor of the chosen building, then the map / aerial switch. */
  #tools { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; align-items: stretch; }
  #floorbox { position: relative; }
  #floorbtn { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-width: 200px; height: 48px; padding: 0 16px; border-radius: 0;
              background: var(--ink); border: 1px solid var(--accent); color: #fff; font: 500 17px var(--grot); }
  #floorbtn svg { transition: rotate .3s var(--ease); } #floorbox.open #floorbtn svg { rotate: 180deg; }
  /* Until a floor is chosen it is the loudest thing on the map: solid accent, with a slow pulse. */
  #floorbox.unset #floorbtn { background: var(--accent); animation: nudge 1.8s var(--ease) infinite; }
  #floorbox.open #floorbtn { animation: none; }
  @keyframes nudge { 50% { box-shadow: 0 0 0 7px #ff5a3647; } }
  /* The list unfurls from the button: the sheet wipes down while its rows settle in one after another. */
  #floorlist { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: min(52vh, 420px); overflow-y: auto; background: var(--ink); border: 1px solid var(--accent);
               scrollbar-color: var(--accent) #0000; clip-path: inset(0 0 100% 0); visibility: hidden; transition: clip-path .42s var(--ease), visibility 0s .42s; }
  #floorbox.open #floorlist { clip-path: inset(0); visibility: visible; transition-delay: 0s; }
  #floorlist button { display: block; width: 100%; text-align: left; background: none; border-radius: 0; color: #fff; font: 400 16px var(--grot); padding: 10px 16px;
                      opacity: 0; transform: translateY(-8px); transition: opacity .3s var(--ease), transform .3s var(--ease); }
  #floorbox.open #floorlist button { opacity: 1; transform: none; transition-delay: calc(min(var(--i), 16) * 22ms + 60ms); }
  #floorlist button[aria-selected="true"] { color: var(--accent); }
  #floorlist button:hover, #floorlist button:focus-visible { background: var(--accent); color: var(--ink); outline: none; }
  #views { display: flex; padding: 3px; }
  #views button, #compass button { background: none; color: var(--dim); border-radius: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; }
  #views button { padding: 7px 14px; }
  #views button.sel, #compass button.sel { background: var(--panel2); color: var(--text); }
  #compass { position: absolute; right: 16px; bottom: 16px; display: grid; grid-template: repeat(3, 36px) / repeat(3, 36px); gap: 3px; padding: 3px; }
  #compass button { padding: 0; }
  .target { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 0 2px #05080c99; }
  .target::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ping 2s var(--ease) infinite; }
  @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(4.5); opacity: 0; } }
  .maplibregl-ctrl.maplibregl-ctrl-attrib { font: 11px var(--grot); background: #05080ccc; color: var(--dim); }
  .maplibregl-ctrl-attrib a { color: var(--dim); }
  .maplibregl-ctrl-attrib-button { filter: invert(1); }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
    #stage { order: -1; } #panel { border-right: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { .step, .view, #aimg { transition: none; } .target::after, #floorbox.unset #floorbtn { animation: none; } #floorlist, #floorlist button { transition: none; } }
</style>
</head>
<body>
<nav class="nav caps" aria-label="Primesight"><a href="dispatch-judge.html" aria-current="page">First responder</a><a class="mark" href="home.html">Primesight</a><a href="game.html">Game</a></nav>
<main>
  <aside id="panel">
    <nav id="trail" class="caps" aria-label="Steps"></nav>
    <section class="step on" data-s="1">
      <h2>Choose a building</h2>
      <input id="q" placeholder="Search address or city" aria-label="Search address or city" autocomplete="off">
      <div class="rows" id="blist"></div>
      <div class="foot"><button class="primary" id="next1" disabled>Confirm location</button></div>
    </section>
    <section class="step" data-s="2">
      <h2>What is the emergency?</h2>
      <div class="cats" id="cats"></div>
      <div class="rows" id="types"></div>
      <div id="text"></div>
      <div class="foot" id="foot2"><button class="ghost" data-go="1">Back</button><button class="primary" id="send" disabled>Text it to the crew</button></div>
      <div class="foot" id="sent" hidden><b>Sent to the crew</b><a href="phone.html?id=judge" target="_blank">Open the phone</a><button class="ghost" id="again">New dispatch</button></div>
    </section>
  </aside>
  <div id="stage">
    <div class="view on" id="map"></div>
    <div class="view" id="aerial">
      <img id="aimg" alt="Aerial photo of the selected building">
      <div class="glass caps" id="compass" role="group" aria-label="Aerial view direction">
        <button data-side="north" style="grid-area:1/2" aria-label="Looking north">N</button>
        <button data-side="west" style="grid-area:2/1" aria-label="Looking west">W</button>
        <button data-side="top" style="grid-area:2/2" aria-label="Top down">Top</button>
        <button data-side="east" style="grid-area:2/3" aria-label="Looking east">E</button>
        <button data-side="south" style="grid-area:3/2" aria-label="Looking south">S</button>
      </div>
    </div>
    <div id="tools" hidden>
      <div id="floorbox" class="unset">
        <button id="floorbtn" aria-haspopup="listbox" aria-expanded="false"><span id="floorlabel">Choose floor</span><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg></button>
        <div id="floorlist" role="listbox" aria-label="Floor"></div>
      </div>
      <div class="glass caps" id="views"><button data-view="map">Map</button><button data-view="aerial">Aerial</button></div>
    </div>
    <div class="glass" id="caption" aria-live="polite"></div>
  </div>
</main>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="common.js"></script>
<script src="site.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SIDES = { top: "top down", north: "looking north", east: "looking east", south: "looking south", west: "looking west" };
let B = [], I = [];
const s = { step: 1, b: null, f: null, cat: null, i: null, view: "map", side: "top" };

// ---- Map (site.js): choosing a building flies in and circles it. One dot per building; a dot is clickable too.
const { map, fly } = makeMap("map");
map.on("load", () => {
  map.addSource("pts", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "pts", type: "circle", source: "pts", paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 3, 2.5, 12, 5], "circle-color": "#fff", "circle-stroke-color": "#ff5a36", "circle-stroke-width": 1.5 } });
  map.on("click", "pts", e => selectBuilding(B.find(b => b.pid === e.features[0].properties.pid)));
  map.on("mouseenter", "pts", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "pts", () => map.getCanvas().style.cursor = "");
  dots();
});
function dots() {
  const src = map.getSource("pts");
  if (src) src.setData({ type: "FeatureCollection", features: B.filter(b => b.lat).map(b => ({ type: "Feature", properties: { pid: b.pid }, geometry: { type: "Point", coordinates: [b.lon, b.lat] } })) });
}

// ---- Stage: the map or a Vexcel aerial of the chosen building, with the floor dropdown and view switch on top.
function stage() {
  $("tools").hidden = !(s.step === 1 && s.b);
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("sel", b.dataset.view === s.view));
  for (const v of ["map", "aerial"]) $(v).classList.toggle("on", v === s.view);
  $("caption").textContent = s.view === "aerial" ? `Vexcel aerial, ${SIDES[s.side]}` : "";
  $("next1").disabled = !(s.b && s.f);
  $("next1").textContent = s.b && !s.f ? "Choose a floor on the map" : "Confirm location";  // the button says what is missing
}
function aerial(side) {
  s.side = side; $("aimg").classList.add("loading"); $("aimg").src = `/aerial/${s.b.pid}/${side}.jpg`;
  document.querySelectorAll("#compass button").forEach(b => b.classList.toggle("sel", b.dataset.side === side));
  stage();
}
$("aimg").onload = () => $("aimg").classList.remove("loading");
$("aimg").onerror = () => { if (s.view === "aerial") $("caption").textContent = `No Vexcel image ${SIDES[s.side]} for this building.`; };
$("views").onclick = e => { const v = e.target.dataset.view; if (!v) return; s.view = v; v === "aerial" ? aerial(s.side) : stage(); };
$("compass").onclick = e => { const side = e.target.dataset.side; if (side) aerial(side); };
// The floor dropdown: a button that unfurls a list of the building's floors.
function setFloor(f) {
  s.f = f; $("floorlabel").textContent = f ? `Floor ${f}` : "Choose floor"; $("floorbox").classList.toggle("unset", !f);
  document.querySelectorAll("#floorlist button").forEach(b => b.setAttribute("aria-selected", +b.dataset.f === f));
  stage();
}
function openFloors(on) {
  $("floorbox").classList.toggle("open", on); $("floorbtn").setAttribute("aria-expanded", on);
  if (on) (document.querySelector('#floorlist [aria-selected="true"]') || $("floorlist").firstChild)?.focus();
}
$("floorbtn").onclick = () => openFloors(!$("floorbox").classList.contains("open"));
$("floorlist").onclick = e => { const b = e.target.closest("button"); if (b) { setFloor(+b.dataset.f); openFloors(false); $("floorbtn").focus(); } };
document.addEventListener("click", e => { if (!e.target.closest("#floorbox")) openFloors(false); });

// ---- Panel: buildings, then the emergency.
function renderBuildings() {
  const hits = matchBuildings(B, $("q").value);
  $("blist").innerHTML = hits.map(b => `<button class="row ${s.b === b ? "sel" : ""}" data-pid="${b.pid}">${esc(b.address)}<span>${esc(b.city)}</span></button>`).join("") || `<div class="none">No building matches.</div>`;
}
function selectBuilding(b) {
  if (!b) return;
  Object.assign(s, { b, f: null, view: "map", side: "top" });
  $("floorlist").innerHTML = floorOptions(b).map((o, k) => `<button role="option" aria-selected="false" data-f="${o.floor}" style="--i:${k}">Floor ${o.floor}</button>`).join("");
  openFloors(false);
  if (s.step !== 1) go(1);
  renderBuildings(); setFloor(null); fly(b);
  document.querySelector("#blist .sel")?.scrollIntoView({ block: "nearest" });
}
function renderEmergency() {
  const cats = [...new Set(I.map(t => t.category))];
  s.cat ||= cats[0];
  if (s.i && s.i.category !== s.cat) s.i = null;
  $("cats").innerHTML = cats.map(c => `<button data-c="${c}" class="${c === s.cat ? "sel" : ""}"><i style="background:${CATEGORY_COLORS[c]}"></i>${c}</button>`).join("");
  $("types").innerHTML = I.filter(t => t.category === s.cat).map(t => `<button class="row ${s.i === t ? "sel" : ""}" data-id="${t.id}">${esc(t.label)}</button>`).join("");
  $("text").textContent = s.i ? dispatchText({ building: s.b, floor: s.f, incident: s.i }) : "Choose the emergency type.";
  $("text").classList.toggle("ready", !!s.i); $("send").disabled = !s.i; $("foot2").hidden = false; $("sent").hidden = true;
}
function renderTrail() {
  const labels = [s.step > 1 ? `${s.b.address}, floor ${s.f}` : "Location", "Emergency"];
  $("trail").innerHTML = labels.map((l, k) => `${k ? '<span class="sep">/</span>' : ""}<button data-go="${k + 1}" ${k + 1 === s.step ? 'aria-current="step"' : ""} ${k + 1 > s.step ? "disabled" : ""}>${esc(l)}</button>`).join("");
}
function go(n) {
  s.step = n;
  document.querySelectorAll(".step").forEach(el => { el.classList.toggle("on", +el.dataset.s === n); el.classList.toggle("past", +el.dataset.s < n); });
  if (n === 2) renderEmergency();
  openFloors(false); renderTrail(); stage();
}

$("q").oninput = renderBuildings;
$("blist").onclick = e => { const r = e.target.closest(".row"); if (r) selectBuilding(B.find(b => b.pid == r.dataset.pid)); };
$("next1").onclick = () => go(2);
$("cats").onclick = e => { const b = e.target.closest("button"); if (b) { s.cat = b.dataset.c; renderEmergency(); } };
$("types").onclick = e => { const r = e.target.closest(".row"); if (r) { s.i = I.find(t => t.id === r.dataset.id); renderEmergency(); } };
document.addEventListener("click", e => { const n = e.target.closest("[data-go]"); if (n && !n.disabled) go(+n.dataset.go); });
$("send").onclick = async () => {
  $("send").disabled = true;
  try { await api("/sms", { phone: "judge", text: $("text").textContent }); $("foot2").hidden = true; $("sent").hidden = false; }
  catch (e) { $("text").textContent = "Could not send. Check that the Primesight server is running, then try again."; $("send").disabled = false; }
};
$("again").onclick = () => location.reload();
// Arrow keys move through the buildings like a selection screen; Enter takes the step's main button.
document.addEventListener("keydown", e => {
  const dir = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0;
  if (e.target.closest("#floorbox")) {  // inside the floor dropdown: arrows move through the floors, Escape closes it
    if (e.key === "Escape") { openFloors(false); $("floorbtn").focus(); }
    if (dir && $("floorbox").classList.contains("open")) { e.preventDefault(); const o = [...document.querySelectorAll("#floorlist button")]; o[Math.max(0, Math.min(o.length - 1, o.indexOf(document.activeElement) + dir))].focus(); }
    return;
  }
  if (dir && s.step === 1) { e.preventDefault(); const hits = matchBuildings(B, $("q").value); selectBuilding(hits[Math.max(0, Math.min(hits.length - 1, hits.indexOf(s.b) + dir))]); }
  if (e.key === "Enter" && !e.target.closest("button, a, select")) { const b = document.querySelector(".step.on .primary"); if (b && !b.disabled) b.click(); }
});

renderTrail();
Promise.all([getBuildings(), getIncidents()]).then(([b, i]) => { B = b; I = i; renderBuildings(); dots(); })
  .catch(() => { $("blist").innerHTML = `<div class="none">Could not load the buildings. Check that the Primesight server is running.</div>`; });
</script>
</body>
</html>
