<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primesight First Responder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="site.css">
<style>
  /* Three steps. 1: the location (building from the list, floor from the dropdown on the map). 2: the emergency, where the
     panel widens and the stage shows what that kind of call needs first: the turning floor plan with its exit signs and
     alarm pulls, or the street with its hydrants and the wind. 3: sent. The agent's steps on the left, the crew's phone on the right. */
  [hidden] { display: none !important; }
  /* clip, not hidden: scrollIntoView on a row must not side-scroll the page or panel while a step is still sliding in */
  body { height: 100vh; padding-top: 64px; overflow: clip; }
  button:disabled { cursor: default; opacity: .35; }
  .nav { background: var(--ink); border-bottom: 1px solid var(--line); }

  main { display: grid; grid-template-columns: 400px 1fr; height: 100%; min-height: 0; transition: grid-template-columns .6s var(--ease); }
  body:not([data-step="1"]) main { grid-template-columns: 58% 1fr; }
  #panel { position: relative; border-right: 1px solid var(--line); overflow: clip; background: var(--ink); }
  #trail { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px; border-bottom: 1px solid var(--line); min-width: 0; }
  #trail button { background: none; padding: 4px 0; border-radius: 0; color: var(--dim); font: inherit; letter-spacing: inherit; text-transform: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #trail button:not(:disabled):hover, #trail button[aria-current] { color: var(--text); }
  #trail .sep { color: var(--line); }
  .step { position: absolute; inset: 44px 0 0; display: flex; flex-direction: column; padding: 22px 20px 18px; opacity: 0; visibility: hidden;
          transform: translateX(32px); transition: opacity .3s var(--ease), transform .3s var(--ease), visibility 0s .3s; }
  .step.past { transform: translateX(-32px); }
  .step.on { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .step h2 { font: 400 30px/1.1 var(--grot); letter-spacing: -.01em; margin: 0; }
  .step input { margin-bottom: 12px; border-radius: 0; background: var(--ink); }
  .step input:focus { border-color: var(--accent); outline: none; }
  .rows { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -20px; scrollbar-color: var(--accent) #0000; }
  /* Black and orange: orange labels on black, and the chosen row turns solid orange. */
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none;
         border-radius: 0; padding: 11px 20px; color: var(--text); font: 400 17px/1.3 var(--grot); }
  .row span { color: var(--accent); font: 400 11px var(--code); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
  .row:hover { color: var(--accent); }
  .row.sel, .row.sel span { background: var(--accent); color: var(--ink); }
  .none { padding: 11px 20px; color: var(--dim); }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .cats button { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); border-radius: 0; color: var(--text);
                 font: 400 14px var(--grot); padding: 9px 10px; text-transform: capitalize; }
  .cats button i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .cats button.sel { background: var(--panel2); border-color: var(--text); }
  #text { padding: 14px 0; min-height: 4.6em; color: var(--dim); border-top: 1px solid var(--line); }
  #text.ready { color: var(--text); }
  .foot { display: flex; gap: 10px; align-items: center; }
  .step[data-s="1"] .foot { padding-top: 16px; border-top: 1px solid var(--line); }
  .foot button { flex: 1; border-radius: 0; padding: 14px 16px; font: 400 12px var(--code); letter-spacing: .07em; text-transform: uppercase; }
  .foot .ghost { flex: 0 0 auto; }
  #sent { gap: 14px; padding-top: 16px; border-top: 1px solid var(--line); } #sent b { flex: 1; font-weight: 400; color: var(--dim); }
  /* The emergency step has the room: bigger type, all six categories in a row, the types in two columns. */
  .step:not([data-s="1"]) { padding: 40px clamp(24px, 4vw, 56px) 32px; }
  .step:not([data-s="1"]) h2 { font-size: clamp(34px, 3.4vw, 48px); margin-bottom: 28px; }
  .step:not([data-s="1"]) .head h2 { margin: 0; } .step:not([data-s="1"]) .head { margin-bottom: 20px; align-items: baseline; }
  /* Step 3: one row per thing the agent did, as it does it. Helper rows sit in from the edge; the newest row pulses until the text is out. */
  #clock { color: var(--dim); font-size: 14px; }
  #steps { list-style: none; padding: 0; margin: 0; }
  #steps li { display: grid; grid-template-columns: 44px 1fr; gap: 2px 14px; padding: 11px 0; border-top: 1px solid var(--line); animation: pop .35s var(--ease) both; }
  #steps li.helper { margin-left: 58px; }
  #steps time { grid-row: span 2; padding-top: 5px; color: var(--dim); font: 12px var(--code); }
  #steps b { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font: 400 18px/1.3 var(--grot); }
  #steps span { grid-column: 2; color: var(--dim); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #steps span:empty { display: none; }
  #steps em { font: 11px var(--code); letter-spacing: .07em; text-transform: uppercase; color: var(--c); border: 1px solid var(--c); padding: 2px 6px; }
  #steps .ok b { color: var(--ok); } #steps .warn b { color: #f5c400; }
  #steps .ok span, #steps .warn span { white-space: normal; }  /* what the grader found is worth reading in full */
  #steps.live li:last-child time::after { content: ""; display: block; width: 7px; height: 7px; margin-top: 7px; border-radius: 50%; background: var(--accent); animation: think 1s infinite; }
  .step[data-s="2"] .cats { grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 20px; }
  .step[data-s="2"] .cats button { font-size: 15px; padding: 12px; }
  .step[data-s="2"] .rows { margin: 0; display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 8px; }
  /* Each emergency type is a boxed button, outlined like the categories above, so it reads as something to click. */
  .step[data-s="2"] .row { font-size: 20px; padding: 15px 16px; align-items: center; border: 1px solid var(--line);
                           transition: border-color .2s var(--ease), color .2s var(--ease); }
  .step[data-s="2"] .row:hover, .step[data-s="2"] .row:focus-visible { border-color: var(--accent); outline: none; }
  .step[data-s="2"] .row.sel { border-color: var(--accent); }
  .step[data-s="2"] #text { font-size: 20px; padding: 20px 0; }
  .step[data-s="2"] .foot button { padding: 18px; font-size: 13px; }

  /* Dropdowns (floor, city): the sheet unfurls from the button, wiping down while its rows settle in one after another. */
  .drop { position: relative; }
  .sheet { position: absolute; z-index: 3; top: calc(100% + 6px); right: 0; min-width: 100%; max-height: min(52vh, 420px); overflow-y: auto; background: var(--ink);
           border: 1px solid var(--accent); scrollbar-color: var(--accent) #0000; clip-path: inset(0 0 100% 0); visibility: hidden; transition: clip-path .42s var(--ease), visibility 0s .42s; }
  .drop.open .sheet { clip-path: inset(0); visibility: visible; transition-delay: 0s; }
  /* The floor list shows 10 floors at a time (each row 22px line + 20px padding, plus the border); taller buildings scroll. */
  #floorlist { max-height: calc(10 * 42px + 2px); } #floorlist button { line-height: 22px; }
  .sheet button { display: block; width: 100%; text-align: left; white-space: nowrap; background: none; border-radius: 0; color: #fff; font: 400 16px var(--grot); padding: 10px 16px;
                  opacity: 0; transform: translateY(-8px); transition: opacity .3s var(--ease), transform .3s var(--ease); }
  .drop.open .sheet button { opacity: 1; transform: none; transition-delay: calc(min(var(--i), 16) * 22ms + 60ms); }
  .sheet button[aria-selected="true"] { color: var(--accent); }
  .sheet button:hover, .sheet button:focus-visible { background: var(--accent); color: var(--ink); outline: none; }
  #citybtn { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 0; background: none; border: 1px solid var(--line); color: var(--dim); }
  #citybtn:hover, #citybox.open #citybtn { color: #fff; border-color: #fff; }
  #citybox.active #citybtn { color: var(--ink); background: var(--accent); border-color: var(--accent); }
  #floorbtn { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-width: 200px; height: 48px; padding: 0 16px; border-radius: 0;
              background: var(--ink); border: 1px solid var(--accent); color: #fff; font: 500 17px var(--grot); }
  #floorbtn svg { transition: rotate .3s var(--ease); } #floorbox.open #floorbtn svg { rotate: 180deg; }
  /* Until a floor is chosen it is the loudest thing on the map: solid accent, with a slow pulse. */
  #floorbox.unset #floorbtn { background: var(--accent); animation: nudge 1.8s var(--ease) infinite; }
  #floorbox.open #floorbtn { animation: none; }
  @keyframes nudge { 50% { box-shadow: 0 0 0 7px #ff5a3647; } }

  #stage { position: relative; background: #05080c; overflow: hidden; }
  .view { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .5s var(--ease), visibility 0s .5s; }
  .view.on { opacity: 1; visibility: visible; transition-delay: 0s; }
  #aimg { width: 100%; height: 100%; object-fit: contain; transition: opacity .3s; }
  #aimg.loading { opacity: .2; }
  .glass { background: #05080ccc; border: 1px solid var(--line); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #tools { position: absolute; top: 16px; right: 16px; }
  /* The views of the chosen building, as pictures: the 3D map, then the Vexcel aerial from above and from each side. */
  #strip { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; max-width: calc(100% - 32px); overflow-x: auto; scrollbar-width: none; }
  #strip button { position: relative; flex: none; width: 96px; height: 62px; padding: 0; border-radius: 0; overflow: hidden; border: 1px solid var(--line);
                  background: #101820 repeating-linear-gradient(135deg, #ffffff0f 0 1px, #0000 1px 9px); }
  #strip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #strip span { position: absolute; inset: auto 0 0; padding: 12px 6px 4px; text-align: left; color: #fff; background: linear-gradient(#0000, #000c); }
  #strip button:hover { border-color: #fff; }
  #strip button[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  /* The floor, tilted and turning. Each located sign is a lit dot with a beam standing on it. */
  #floor3d { display: grid; place-items: center; perspective: 1500px; padding-right: 150px; }  /* the building stands in those 150px */
  #plate { position: relative; transform-style: preserve-3d; transform: rotateX(55deg); animation: turn 80s linear infinite; }
  @keyframes turn { from { transform: rotateX(55deg) rotateZ(0deg); } to { transform: rotateX(55deg) rotateZ(360deg); } }
  #plate .img { position: absolute; inset: 0; background: center / 100% 100% no-repeat; filter: saturate(.5) brightness(.8) contrast(1.15); outline: 1px solid #ffffff2e; box-shadow: 0 0 90px #3fa7ff26; }
  .pin { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 28%, #0000), 0 0 22px var(--c); transform-style: preserve-3d; }
  .pin::before, .pin::after { content: ""; position: absolute; left: 6px; bottom: 7px; width: 2px; height: 90px; background: linear-gradient(to top, var(--c), #0000); transform-origin: bottom; transform: rotateX(-90deg); }
  .pin::after { transform: rotateX(-90deg) rotateY(90deg); }  /* two crossed blades, so the beam shows from every side */
  .pin.exit, .k.exit { --c: var(--ok); } .pin.alarm, .k.alarm { --c: #ff3d6e; }
  .k.at { --c: var(--accent); } .k.near { --c: #f5c400; } .k.water { --c: #3fa7ff; } .k.wind { --c: #cfd6dd; }
  #floornote { position: absolute; left: 20px; top: 20px; display: grid; gap: 6px; padding: 12px 14px; font-size: 14px; max-width: calc(100% - 200px); }
  #floornote:empty { display: none; }
  #floornote b { font-weight: 500; font-size: 16px; }
  .k { --c: #fff; display: flex; align-items: baseline; gap: 8px; color: #dfe4ea; }
  .k::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  /* The building floor by floor, street at the bottom. Each bar is filled by that floor's headcount; the floor of the call
     and the floors that matter for this kind of call are lit in the colours the key uses. */
  #stack { position: absolute; right: 20px; top: 50%; translate: 0 -50%; display: grid; gap: 1px; width: 124px; padding: 8px 12px; }
  #stack span { padding: 4px 0; font-size: 10px; color: var(--dim); }
  #stack i { position: relative; height: var(--h); background: #ffffff1a; }
  #stack i::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: #ffffff66; }
  #stack i.near { background: #f5c40038; } #stack i.near::before { background: #f5c400; }
  #stack i.at { background: #ff5a3666; outline: 1px solid var(--accent); z-index: 1; } #stack i.at::before { background: var(--accent); }
  #stack i.at::after { content: attr(data-f); position: absolute; right: calc(100% + 20px); top: 50%; translate: 0 -50%; padding: 2px 6px; white-space: nowrap;
                       background: var(--accent); color: var(--ink); font: 11px var(--code); letter-spacing: .07em; }
  /* Floor or street: which side of the building the stage shows. The kind of emergency picks one; these switch it. */
  #sides { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; display: flex; gap: 6px; padding: 6px; }
  #sides button { padding: 9px 16px; border-radius: 0; background: none; border: 1px solid var(--line); color: #fff; font: inherit; letter-spacing: inherit; text-transform: inherit; }
  #sides button:hover { border-color: #fff; } #sides button[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  /* A hydrant on the map. The dot is drawn on ::before: styling the marker element itself would fight MapLibre's own transform. */
  .hyd { display: flex; align-items: center; gap: 7px; color: #fff; text-shadow: 0 1px 4px #000, 0 0 2px #000; }
  .hyd::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #3fa7ff; border: 2px solid #fff; box-shadow: 0 0 0 5px #3fa7ff4d; }
  /* The way the wind carries smoke: a wedge fading out from the building. The marker itself has no size, so it turns about the building. */
  .drift { width: 0; height: 0; pointer-events: none; }
  .drift::before { content: ""; position: absolute; left: 0; top: -70px; width: 210px; height: 140px; clip-path: polygon(0 50%, 100% 0, 100% 100%); background: linear-gradient(90deg, #ffffffb3, #fff0); }
  /* Step 3: the scene dims behind the crew's phone. */
  body[data-step="3"] .view.on { opacity: .28; }
  #phone { position: absolute; inset: 0; margin: auto; width: min(390px, calc(100% - 40px)); height: min(660px, calc(100% - 40px)); animation: pop .5s var(--ease) both; }
  #phone .msg { font-size: 13.5px; } #phone .pics { display: flex; gap: 6px; flex: none; } #phone .pic { max-width: none; flex: 1; border-radius: 12px; } #phone .pic img { height: 104px; object-fit: cover; }
  .target { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 0 2px #05080c99; }
  .target::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ping 2s var(--ease) infinite; }
  @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(4.5); opacity: 0; } }

  @media (max-width: 820px) {
    main, body:not([data-step="1"]) main { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
    #stage { order: -1; } #panel { border-right: 0; border-top: 1px solid var(--line); }
    .step[data-s="2"] .cats { grid-template-columns: repeat(3, 1fr); } .step[data-s="2"] .rows { grid-template-columns: 1fr; }
    #strip button { width: 64px; height: 44px; } #stack { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    main, .step, .view, #aimg, .sheet, .sheet button { transition: none; }
    .target::after, #floorbox.unset #floorbtn, #plate, #steps li, #steps.live li:last-child time::after, #phone, .msg, .msg.dots i { animation: none; }
  }
</style>
</head>
<body data-step="1">
<nav class="nav caps" aria-label="Primesight"><a href="dispatch-judge.html" aria-current="page">First responder</a><a class="mark" href="home.html">Primesight</a><span></span></nav>
<main>
  <aside id="panel">
    <nav id="trail" class="caps" aria-label="Steps"></nav>
    <section class="step on" data-s="1">
      <div class="head">
        <h2>Choose a building</h2>
        <div class="drop" id="citybox">
          <button id="citybtn" aria-label="Filter by city" aria-haspopup="listbox" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 3.5h12M4.5 8h7M6.5 12.5h3"/></svg></button>
          <div class="sheet" id="citylist" role="listbox" aria-label="City"></div>
        </div>
      </div>
      <input id="q" placeholder="Search address or city" aria-label="Search address or city" autocomplete="off">
      <div class="rows" id="blist"></div>
      <div class="foot"><button class="primary" id="next1" disabled>Confirm location</button></div>
    </section>
    <section class="step" data-s="2">
      <h2>What is the emergency?</h2>
      <div class="cats" id="cats"></div>
      <div class="rows" id="types"></div>
      <div id="text"></div>
      <div class="foot" id="foot2"><button class="ghost" data-go="1">Back</button><button class="primary" id="send" disabled>Text it to the crew</button></div>
    </section>
    <section class="step" data-s="3">
      <div class="head"><h2 id="runhead" aria-live="polite">Writing the briefing</h2><span class="caps" id="clock">0:00</span></div>
      <ol class="rows live" id="steps"></ol>
      <div class="foot" id="sent"><b id="sentmsg"></b><a id="phonelink" href="phone.html?id=judge" target="_blank">Open the thread</a><button class="ghost" id="again">New dispatch</button></div>
    </section>
  </aside>
  <div id="stage">
    <div class="view on" id="map"></div>
    <div class="view" id="aerial"><img id="aimg" alt="Aerial photo of the selected building"></div>
    <div class="view" id="floor3d"><div id="plate"></div></div>
    <div id="tools" hidden>
      <div class="drop unset" id="floorbox">
        <button id="floorbtn" aria-haspopup="listbox" aria-expanded="false"><span id="floorlabel">Choose floor</span><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg></button>
        <div class="sheet" id="floorlist" role="listbox" aria-label="Floor"></div>
      </div>
    </div>
    <div class="glass caps" id="strip" role="tablist" aria-label="View of the building" hidden></div>
    <div class="glass" id="floornote" aria-live="polite" hidden></div>
    <div class="glass" id="stack" aria-hidden="true" hidden></div>
    <div class="glass caps" id="sides" role="tablist" aria-label="Side of the building" hidden><button role="tab" data-side="floor">Floor</button><button role="tab" data-side="street">Street</button></div>
    <div class="phone" id="phone" hidden>
      <div class="phone-top"><b>Primesight</b><span class="caps" id="phonesub">The crew's phone</span></div>
      <div class="thread" id="thread" aria-live="polite"></div>
    </div>
  </div>
</main>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="common.js"></script>
<script src="site.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const VIEWS = [["map", "Map"], ["top", "Top"], ["north", "North"], ["east", "East"], ["south", "South"], ["west", "West"]];
let B = [], I = [];
// b building, f floor, cat/i emergency category and type, view the step 1 picture, fv the floor plan, sc the floor's facts
// (/scene), side which side of the building step 2 shows ("floor" or "street").
const s = { step: 1, b: null, f: null, city: "", cat: null, i: null, view: "map", fv: null, sc: null, side: "floor" };

// ---- Map (site.js): choosing a building flies in and circles it. One dot per building; a dot is clickable too.
const { map, fly, hold, resume } = makeMap("map");
map.on("load", () => {
  map.addSource("pts", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "pts", type: "circle", source: "pts", paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 3, 2.5, 12, 5], "circle-color": "#fff", "circle-stroke-color": "#ff5a36", "circle-stroke-width": 1.5 } });
  map.on("click", "pts", e => selectBuilding(B.find(b => b.pid === e.features[0].properties.pid)));
  map.on("mouseenter", "pts", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "pts", () => map.getCanvas().style.cursor = "");
  dots();
});
function dots() {
  const src = map.getSource("pts");
  if (src) src.setData({ type: "FeatureCollection", features: B.filter(b => b.lat).map(b => ({ type: "Feature", properties: { pid: b.pid }, geometry: { type: "Point", coordinates: [b.lon, b.lat] } })) });
}

// ---- Stage. Step 1: the map, or a Vexcel aerial picked from the strip. Steps 2 and 3: the turning floor plan, or the street
// on the map (also when there is no plan).
let mapOn = true;
function stage() {
  const picking = s.step === 1 && !!s.b;
  $("tools").hidden = $("strip").hidden = !picking; $("floornote").hidden = s.step !== 2; $("phone").hidden = s.step !== 3;
  $("sides").hidden = s.step !== 2 || !s.fv;
  document.querySelectorAll("#sides button").forEach(b => b.setAttribute("aria-selected", b.dataset.side === s.side));
  const view = s.step > 1 ? (s.fv && s.side === "floor" ? "floor3d" : "map") : s.view === "map" ? "map" : "aerial";
  for (const v of ["map", "aerial", "floor3d"]) $(v).classList.toggle("on", v === view);
  if (mapOn && view !== "map") hold();  // the map only circles while it is on screen
  if (!mapOn && view === "map" && s.b) resume();
  mapOn = view === "map";
  document.querySelectorAll("#strip button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === s.view));
  $("next1").disabled = !(s.b && s.f);
  $("next1").textContent = s.b && !s.f ? "Choose a floor on the map" : "Confirm location";  // the button says what is missing
}
function setView(v) {
  s.view = v;
  if (v !== "map") { $("aimg").classList.add("loading"); $("aimg").src = `/aerial/${s.b.pid}/${v}.jpg`; }
  stage();
}
$("aimg").onload = () => $("aimg").classList.remove("loading");
$("strip").onclick = e => { const b = e.target.closest("button"); if (b) setView(b.dataset.v); };
let thumbs;
function renderStrip() {
  $("strip").innerHTML = VIEWS.map(([v, name]) => `<button role="tab" data-v="${v}">${v === "map" ? "" : `<img data-src="/aerial/${s.b.pid}/${v}.jpg" alt="">`}<span>${name}</span></button>`).join("");
  clearTimeout(thumbs);  // wait a moment before asking Vexcel, so arrowing through the list doesn't fetch five photos per building
  thumbs = setTimeout(() => document.querySelectorAll("#strip img").forEach(i => { i.onerror = () => i.parentElement.hidden = true; i.src = i.dataset.src; }), 900);
}

// ---- The floor plan in step 2.
let floorTick = 0;
async function loadFloor() {
  const t = ++floorTick; s.fv = null; $("floornote").textContent = "";
  try {
    const fv = await api(`/floor/${s.b.pid}/${s.f}`);
    if (t !== floorTick) return;
    s.fv = fv; $("plate").dataset.aspect = fv.aspect; sizePlate();
    $("plate").innerHTML = `<div class="img" style="background-image:url(${fv.image})"></div>` + fv.points.map(p => `<i class="pin ${p.kind === "exit sign" ? "exit" : "alarm"}" style="left:${p.x * 100}%;top:${p.y * 100}%"></i>`).join("");
  } catch (e) { /* no plan for this building: step 2 shows the street */ }
  if (t === floorTick) scene();
}
// The floor's facts, the ones a briefing is written from: people floor by floor, hydrants, wind, elevators (about 3 s).
async function loadScene() {
  const t = floorTick; s.sc = null;
  try { const sc = await api(`/scene/${s.b.pid}/${s.f}`); if (t === floorTick) s.sc = sc; } catch (e) { /* the plan and the map still show */ }
  if (t === floorTick) scene();
}

// ---- Step 2: the stage shows what this kind of emergency needs first, the same choice the briefing makes (FIRST in
// primesight/briefing.py). A fire or hazmat call looks at the street: hydrants, and where the wind carries smoke. The
// rest look at the floor. The key names what is lit, and the building at the side lights the floors that matter.
const STREET = ["fire", "hazmat"], DIRS = "N NE E SE S SW W NW".split(" "), compass = deg => DIRS[Math.round(deg / 45) % 8];
const some = (c, word) => `${c} ${word}${c === 1 ? "" : "s"}`, about = c => c ? `about ${c.toLocaleString()} people` : "no headcount on record";
// The other floors that matter: above a fire, below a leak, either side of a hazmat or security call. [from, to, name] or null.
function reach() {
  const top = s.sc.floors.length, r = s.cat === "fire" ? [s.f + 1, top, "Above"] : s.cat === "utility" ? [1, s.f - 1, "Below"]
    : s.cat === "hazmat" || s.cat === "security" ? [Math.max(1, s.f - 2), Math.min(top, s.f + 2), "Next to it"] : null;
  return r && r[0] <= r[1] ? r : null;
}
function key() {
  const sc = s.sc, fv = s.fv, rows = [], add = (cls, text) => rows.push(`<span class="k ${cls}">${esc(text)}</span>`);
  const here = sc?.floors[s.f - 1];
  if (here) {
    const r = reach(), near = r ? sc.floors.slice(r[0] - 1, r[1]).reduce((t, f) => t + (f.floor === s.f ? 0 : f.people), 0) : 0;
    add("at", `Floor ${s.f}: ${here.tenants.length ? `${here.tenants[0]}${here.tenants.length > 1 ? ` +${here.tenants.length - 1} more` : ""}, ` : ""}${about(here.people)}`);
    if (r) add("near", `${r[2]}: ${about(near)} on floors ${r[0]} to ${r[1]}`);
  }
  if (sc && s.cat === "fire" && sc.hydrants.length) add("water", `Hydrants: ${sc.hydrants.slice(0, 3).map(h => `${h.m} m ${h.dir}`).join(", ")}`);
  if (sc?.wind && STREET.includes(s.cat)) add("wind", `${s.cat === "fire" ? "Smoke drifts" : "Fumes drift"} ${compass(sc.wind.from + 180)}: wind from ${compass(sc.wind.from)}, ${sc.wind.mph} mph`);
  if (sc && s.cat === "hazmat" && sc.staging.length) add("", `Open lot to stage in: ${sc.staging[0].m} m ${sc.staging[0].dir}`);
  if (sc && ["medical", "rescue", "utility"].includes(s.cat)) {
    const cars = sc.elevators.map(e => `${e.count || ""} ${e.type.toLowerCase()}`.trim());
    add("", s.cat !== "medical" ? `Elevators: ${cars.join(", ") || "none on record"}` : cars.includes("freight") || sc.elevators.some(e => e.type === "Freight") ? "Elevator: freight car on record, fits a stretcher"
      : cars.length ? "Elevator: passenger only on record" : "Elevator: none on record");
  }
  if (fv && s.side === "floor") {
    const n = k => fv.points.filter(p => p.kind === k).length;
    add("exit", some(n("exit sign"), "exit sign")); add("alarm", some(n("fire alarm pull station"), "alarm pull"));
  }
  $("floornote").innerHTML = rows.length ? `<b>${fv && !fv.exact ? `No scan of floor ${s.f}. Showing floor ${fv.floor}.` : `For a ${esc(s.cat)} call`}</b>${rows.join("")}` : "";
}
function tower() {
  const fl = s.sc?.floors || [], show = s.step === 2 && fl.length > 1;
  $("stack").hidden = !show;
  if (!show) return;
  const r = reach(), most = Math.max(1, ...fl.map(f => f.people));
  $("stack").style.setProperty("--h", Math.max(2, Math.min(12, Math.floor(($("stage").clientHeight - 150) / fl.length) - 1)) + "px");
  $("stack").innerHTML = `<span class="caps">${fl.length} floors</span>` + [...fl].reverse().map(f =>
    `<i class="${f.floor === s.f ? "at" : r && f.floor >= r[0] && f.floor <= r[1] ? "near" : ""}" data-f="Floor ${f.floor}" style="--w:${f.people / most * 100}%"></i>`).join("") + `<span class="caps">Street</span>`;
}
// On the map: a dot on each hydrant (fire), and a wedge from the building the way the wind carries smoke or fumes. The
// wedge is a marker lying flat on the ground, not a map layer: a layer on the ground is hidden behind downtown's towers.
let marks = [], street = false;
function outside() {
  const on = s.step > 1 && s.sc, to = on && s.sc.wind && STREET.includes(s.cat) ? s.sc.wind.from + 180 : null, here = s.b && [s.b.lon, s.b.lat];
  marks.forEach(m => m.remove());
  marks = (on && s.cat === "fire" ? s.sc.hydrants.slice(0, 3) : []).map(h => {
    const el = document.createElement("div"); el.className = "hyd caps"; el.textContent = `${h.m} m`;
    return new maplibregl.Marker({ element: el, anchor: "left", offset: [-8, 0] }).setLngLat([h.lon, h.lat]).addTo(map);
  });
  if (to !== null) marks.push(new maplibregl.Marker({ element: Object.assign(document.createElement("div"), { className: "drift" }),  // drawn pointing east
    rotation: to - 90, rotationAlignment: "map", pitchAlignment: "map" }).setLngLat(here).addTo(map));
  // The street view sits higher and flatter than the fly-in of step 1, so the hydrants around the block are in frame,
  // and off-centre, clear of the building drawn at the right edge.
  const now = s.step > 1 && (s.side === "street" || !s.fv);
  if (now !== street) { street = now; fly(s.b, { padding: { top: 0, bottom: 0, left: 0, right: now ? 150 : 0 }, ...(now && { zoom: 16.5, pitch: 32 }) }); }
}
function scene() { stage(); key(); tower(); outside(); }
function setCat(c) { s.cat = c; s.side = STREET.includes(c) ? "street" : "floor"; renderEmergency(); scene(); }
$("sides").onclick = e => { const b = e.target.closest("button"); if (b) { s.side = b.dataset.side; scene(); } };
// The plate turns, so its diagonal has to fit the stage.
function sizePlate() {
  const a = +$("plate").dataset.aspect || 1, d = Math.min($("stage").clientWidth - 150, $("stage").clientHeight * 1.2) * .98;
  $("plate").style.width = d / Math.hypot(1, 1 / a) + "px"; $("plate").style.height = d / Math.hypot(1, a) + "px";
}
new ResizeObserver(() => { sizePlate(); tower(); }).observe($("stage"));

// ---- Dropdowns: the floor (on the map) and the city filter (beside the heading).
function openDrop(box, on, focus = true) {  // focus false: open without taking focus (arrow keys keep moving through buildings)
  box.classList.toggle("open", on); box.querySelector("button").setAttribute("aria-expanded", on);
  if (on && focus) (box.querySelector('.sheet [aria-selected="true"]') || box.querySelector(".sheet button"))?.focus();
}
for (const box of document.querySelectorAll(".drop")) box.querySelector("button").onclick = () => openDrop(box, !box.classList.contains("open"));
document.addEventListener("click", e => { for (const box of document.querySelectorAll(".drop")) if (!box.contains(e.target)) openDrop(box, false); });
function setFloor(f) {
  s.f = f; $("floorlabel").textContent = f ? `Floor ${f}` : "Choose floor"; $("floorbox").classList.toggle("unset", !f);
  document.querySelectorAll("#floorlist button").forEach(b => b.setAttribute("aria-selected", +b.dataset.f === f));
  stage();
}
function listFloors(floors) {
  $("floorlist").innerHTML = floors.map((f, k) => `<button role="option" aria-selected="${f === s.f}" data-f="${f}" style="--i:${k}">Floor ${f}</button>`).join("");
}
$("floorlist").onclick = e => { const b = e.target.closest("button"); if (b) { setFloor(+b.dataset.f); openDrop($("floorbox"), false); $("floorbtn").focus(); } };
function setCity(c) {
  s.city = c; $("citybox").classList.toggle("active", !!c);
  $("citylist").innerHTML = ["", ...new Set(B.map(b => b.city))].map((x, k) => `<button role="option" aria-selected="${x === c}" data-c="${esc(x)}" style="--i:${k}">${esc(x || "All cities")}</button>`).join("");
  renderBuildings();
  const pts = hits().filter(b => b.lat);  // with no building chosen yet, show the city's buildings on the map
  if (!s.b && pts.length) map.fitBounds([[Math.min(...pts.map(b => b.lon)), Math.min(...pts.map(b => b.lat))], [Math.max(...pts.map(b => b.lon)), Math.max(...pts.map(b => b.lat))]], { padding: 90, maxZoom: 11, duration: 1600 });
}
$("citylist").onclick = e => { const b = e.target.closest("button"); if (b) { setCity(b.dataset.c); openDrop($("citybox"), false); $("citybtn").focus(); } };

// ---- Panel: buildings, then the emergency.
const hits = () => matchBuildings(B, $("q").value).filter(b => !s.city || b.city === s.city);
function renderBuildings() {
  $("blist").innerHTML = hits().map(b => `<button class="row ${s.b === b ? "sel" : ""}" data-pid="${b.pid}">${esc(b.address)}<span>${esc(b.city)}</span></button>`).join("") || `<div class="none">No building matches.</div>`;
}
function selectBuilding(b) {
  if (!b) return;
  Object.assign(s, { b, view: "map" });
  // Only floors with a 3D scan are offered: a briefing for any other floor would describe the wrong floor.
  // The one scanned floor in the building list shows at once; the full list follows from the server.
  listFloors([b.scan_floor].filter(Boolean));
  api(`/scans/${b.pid}`).then(scans => {
    const floors = [...new Set(scans.map(x => x.floor).filter(f => f != null))].sort((x, y) => x - y);
    if (s.b !== b || !floors.length) return;
    listFloors(floors);
    if (floors.length === 1 && !s.f) { setFloor(floors[0]); openDrop($("floorbox"), false); }  // nothing to choose between
  }).catch(() => {});
  if (s.step !== 1) go(1);
  renderBuildings(); renderStrip(); setFloor(null); fly(b);
  document.querySelector("#blist .sel")?.scrollIntoView({ block: "nearest" });
  // Open the floor list straight away: the floor is the next choice. After this click finishes, or the
  // click-outside handler on document would close it again as the same click bubbles up.
  setTimeout(() => openDrop($("floorbox"), true, false));
}
function renderEmergency() {
  const cats = [...new Set(I.map(t => t.category))];
  s.cat ||= cats[0];
  if (s.i && s.i.category !== s.cat) s.i = null;
  $("cats").innerHTML = cats.map(c => `<button data-c="${c}" class="${c === s.cat ? "sel" : ""}"><i style="background:${CATEGORY_COLORS[c]}"></i>${c}</button>`).join("");
  $("types").innerHTML = I.filter(t => t.category === s.cat).map(t => `<button class="row ${s.i === t ? "sel" : ""}" data-id="${t.id}">${esc(t.label)}</button>`).join("");
  $("text").textContent = s.i ? dispatchText({ building: s.b, floor: s.f, incident: s.i }) : "Choose the emergency type.";
  $("text").classList.toggle("ready", !!s.i); $("send").disabled = !s.i;
}
function renderTrail() {
  const labels = [s.step > 1 ? `${s.b.address}, floor ${s.f}` : "Location", s.step > 2 ? s.i.label : "Emergency", "Briefing"];
  // Once it is sent there is no going back a step: the text is out. "New dispatch" starts over.
  $("trail").innerHTML = labels.map((l, k) => `${k ? '<span class="sep">/</span>' : ""}<button data-go="${k + 1}" ${k + 1 === s.step ? 'aria-current="step"' : ""} ${k + 1 > s.step || s.step === 3 ? "disabled" : ""}>${esc(l)}</button>`).join("");
}
function go(n) {
  const from = s.step;
  s.step = n; document.body.dataset.step = n;
  document.querySelectorAll(".step").forEach(el => { el.classList.toggle("on", +el.dataset.s === n); el.classList.toggle("past", +el.dataset.s < n); });
  document.querySelectorAll(".drop").forEach(box => openDrop(box, false));
  if (n === 2) renderEmergency();
  if (n === 2 && from === 1) { s.side = STREET.includes(s.cat) ? "street" : "floor"; loadFloor(); loadScene(); }
  renderTrail(); scene();
}

// ---- Step 3. The page picks the run's id, so it can follow the agent's steps (GET /trace) from the moment it sends, and
// it mirrors the crew's phone thread (GET /sms) as the texts go out.
const clock = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
const say = (cls, text) => { const el = document.createElement("div"); el.className = `msg ${cls}`; el.textContent = text; $("thread").append(el); return el; };
const SOURCES = [["costar", "CoStar records"], ["matterport", "Matterport scan"], ["vexcel", "Vexcel aerial"]];
function follow(run, text) {
  const t0 = performance.now(); let over = false, dots;
  const wait = on => { dots?.remove(); dots = on ? say("it dots", "") : null; if (dots) dots.innerHTML = "<i></i><i></i><i></i>"; };
  $("steps").textContent = ""; $("thread").textContent = ""; $("steps").classList.add("live"); $("runhead").textContent = "Writing the briefing"; $("sentmsg").textContent = "";
  say("me", text); wait(true);
  const tick = setInterval(() => $("clock").textContent = clock((performance.now() - t0) / 1000), 500);
  const stopTrace = streamTrace(run, d => {
    if (d.step === "usage") return;  // token counts: not for this screen
    const [label, detail] = stepLabel(d), pulls = d.step === "gather_building";
    const li = document.createElement("li"); li.className = `${d.who} ${d.step === "graded" ? (d.detail === "satisfied" ? "ok" : "warn") : ""}`;
    li.innerHTML = `<time>${clock(d.t)}</time><b>${esc(pulls ? "Pulls the building's data" : label)}${pulls ? SOURCES.map(([k, name]) => `<em style="--c:${LAYER_COLORS[k]}">${name}</em>`).join("") : ""}</b><span>${esc(detail || "")}</span>`;
    $("steps").append(li); $("steps").scrollTop = 1e9;
  });
  const end = (head, note) => { over = true; clearInterval(tick); wait(false); $("steps").classList.remove("live"); $("runhead").textContent = head; $("sentmsg").textContent = note; };
  // The thread, from this dispatch on. The first text that is not the "got it" is the briefing (or the reason there is none).
  async function thread(key, real) {
    $("phonelink").href = `phone.html?id=${key}`; $("phonesub").textContent = real ? "The crew's phone" : "Phone simulator";
    let shown = 0, sentAt = 0, quiet = 0;
    while (quiet < 12 && s.step === 3) {  // keeps reading a few seconds after the briefing, for the two pictures
      try {
        const all = await api(`/sms/${key}`), from = all.map(m => m.from === "crew" && m.text).lastIndexOf(text), mine = from < 0 ? [] : all.slice(from + 1);
        if (from >= 0) sentAt = all[from].t;
        for (const m of mine.slice(shown)) {
          shown++;
          if (m.from !== "primesight") continue;
          wait(false);
          if (m.type === "image") { const row = $("thread").querySelector(".pics") || $("thread").appendChild(Object.assign(document.createElement("div"), { className: "pics" }));
            const pic = document.createElement("div"); pic.className = "msg it pic"; pic.innerHTML = `<img src="${esc(API + m.url)}" alt="${esc(m.caption || "")}">`; row.append(pic); continue; }
          say("it", m.text);
          if (m.text.startsWith("PRIMESIGHT: got it")) wait(true);
          else if (!over) /^PRIMESIGHT\s*\|/.test(m.text) ? end(`Delivered in ${Math.round(m.t - sentAt)} s`, real ? "Sent to the crew's phone" : "Sent to the phone simulator") : end("No briefing for this call", "");
        }
      } catch (e) { /* server busy: try again */ }
      if (over) quiet++;
      await new Promise(r => setTimeout(r, 800));
    }
  }
  return { thread, stop: () => { over = true; clearInterval(tick); stopTrace(); } };
}

$("q").oninput = renderBuildings;
$("blist").onclick = e => { const r = e.target.closest(".row"); if (r) selectBuilding(B.find(b => b.pid == r.dataset.pid)); };
$("next1").onclick = () => go(2);
$("cats").onclick = e => { const b = e.target.closest("button"); if (b) setCat(b.dataset.c); };
$("types").onclick = e => { const r = e.target.closest(".row"); if (r) { s.i = I.find(t => t.id === r.dataset.id); renderEmergency(); } };
document.addEventListener("click", e => { const n = e.target.closest("[data-go]"); if (n && !n.disabled) go(+n.dataset.go); });
$("send").onclick = async () => {
  const text = $("text").textContent, run = [...crypto.getRandomValues(new Uint8Array(6))].map(x => x.toString(16).padStart(2, "0")).join("");
  $("send").disabled = true;
  go(3);
  const f = follow(run, text);  // before the send answers: on the deploy that answer only comes once the briefing is written
  try {
    // With a crew phone set on the server the text goes to that real phone through Photon; otherwise to the simulator page.
    const r = await api("/sms", { phone: "judge", text, run_id: run });
    f.thread(r.real ? r.phone : "judge", r.real);
  } catch (e) {
    // 409: Photon could not reach the phone (it has to text the line first). Anything else: the server itself.
    f.stop(); go(2);
    $("text").textContent = /409/.test(e.message) ? "Could not reach the crew's phone. Text START to the Primesight line from that phone, then send again."
      : "Could not send. Check that the Primesight server is running, then try again.";
    $("send").disabled = false;
  }
};
$("again").onclick = () => location.reload();
// Keys. Up and down move through the buildings like a selection screen, left and right through the views of the chosen one,
// Enter takes the step's main button. Inside a dropdown the arrows move through its rows and Escape closes it.
document.addEventListener("keydown", e => {
  const dir = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0, turn = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
  const box = e.target.closest(".drop");
  if (box) {
    if (e.key === "Escape") { openDrop(box, false); box.querySelector("button").focus(); }
    if (dir && box.classList.contains("open")) { e.preventDefault(); const o = [...box.querySelectorAll(".sheet button")]; o[Math.max(0, Math.min(o.length - 1, o.indexOf(document.activeElement) + dir))].focus(); }
    return;
  }
  if (dir && s.step === 1) { e.preventDefault(); const h = hits(); selectBuilding(h[Math.max(0, Math.min(h.length - 1, h.indexOf(s.b) + dir))]); }
  if (turn && s.step === 1 && s.b && e.target.id !== "q") { const v = [...document.querySelectorAll("#strip button:not([hidden])")].map(b => b.dataset.v); setView(v[(v.indexOf(s.view) + turn + v.length) % v.length]); }
  if (e.key === "Enter" && !e.target.closest("button, a")) { const b = document.querySelector(".step.on .primary"); if (b && !b.disabled) b.click(); }
});

renderTrail();
Promise.all([getBuildings(), getIncidents()]).then(([b, i]) => { B = b; I = i; setCity(""); dots(); })
  .catch(() => { $("blist").innerHTML = `<div class="none">Could not load the buildings. Check that the Primesight server is running.</div>`; });
</script>
</body>
</html>
